lay:block;font-weight:700;overflow-wrap:anywhere}.tile small{display:block;color:var(--muted);margin-top:3px}.arrow{margin-left:auto;color:var(--muted);font-size:22px}.primary,.ghost{padding:9px 13px;border-radius:10px;font-weight:700}.primary{background:var(--active);border:1px solid transparent;color:#181125}.ghost{background:#1d1f29;border:1px solid var(--edge);color:var(--ink)}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:9px}.actions{justify-content:flex-end;margin-top:17px}.empty{color:var(--muted);padding:22px;border:1px dashed var(--edge);border-radius:15px;margin:0}.bottom{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--edge);background:#111218f5;padding-bottom:env(safe-area-inset-bottom);z-index:2;backdrop-filter:blur(12px)}.bottom .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding-block:8px}.nav{display:grid;justify-items:center;gap:3px;border:0;border-radius:12px;background:none;color:var(--muted);padding:6px 3px;font-size:12px}.nav span{font-size:23px;line-height:1.15}.nav[aria-current=page]{color:var(--active);background:#251e37}.tag{border-radius:999px;padding:5px 9px;background:#29213f;color:#d2c4ff;font-size:12px;white-space:nowrap}.profile{display:flex;align-items:center;gap:14px;margin-bottom:15px}.profile h2{margin:0 0 3px;overflow-wrap:anywhere}.profile .square{width:58px;height:58px;font-weight:800;font-size:21px}.profile .tag{margin-left:auto}.profile p{margin:0}.control{padding:13px 0;border-bottom:1px solid var(--edge)}.control:last-child{border-bottom:0}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.reading{color:var(--tone,var(--active));font-weight:700;white-space:nowrap}.switch{width:44px;height:25px;border:0;border-radius:20px;background:#464957;display:flex;align-items:center;padding:3px;flex:none}.switch::before{content:'';width:19px;height:19px;border-radius:50%;background:#eef0fb}.switch[aria-checked=true]{background:var(--tone,var(--active));justify-content:flex-end}.switch[aria-checked=true]::before{background:#16141e}input[type=range]{width:100%;accent-color:var(--tone,var(--active));margin:10px 0 0}.status{color:var(--muted);font-size:13px;margin:14px 0 0}.status:empty{display:none}

@media(max-width:620px){.wrap{width:calc(100% - 28px)}.top .wrap{height:64px}.brand{font-size:12px}main{padding-top:28px}.gauges{gap:6px}.metric{border-radius:13px;padding:11px 5px}.metric h2{font-size:11px;min-height:30px;display:grid;place-items:center;margin:0 0 6px}.dial{padding:4px}.dial small{font-size:9px}.metric .sub{font-size:10px;margin-top:8px}.nav{font-size:10px}.panel{padding:14px}}
:root{--bg:#191919;--surface:#2d2d2d;--edge:#414141;--muted:#bababa;--active:#ffaacb;--amber:#ffaacb;--blue:#18b5f5;--green:#33dc71}
body{font-family:'Golos Text',system-ui,sans-serif}
.top{background:transparent;border:0;padding-top:18px}
.top .wrap{height:auto;display:block}
.room-picker{position:relative;max-width:620px;margin:auto}
.room-picker::before{content:'';position:absolute;left:18px;top:50%;transform:translateY(-35%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--ink);pointer-events:none}
.room-picker select{appearance:none;width:100%;max-width:none;padding:15px 18px 15px 44px;border:1px solid var(--edge);border-radius:17px;background:var(--surface);font-size:17px;font-weight:600}
main{padding-top:25px}
.home-panel{max-width:620px;margin-inline:auto}
.home-panel .gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;justify-items:center;padding:clamp(14px,4vw,36px);background:var(--surface);border:1px solid #373737;border-radius:clamp(28px,9vw,52px)}
.home-panel .metric{width:100%;background:none;border:0;padding:0 0 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.home-panel .metric:last-child{grid-column:1/-1;width:min(100%,280px);margin-top:5px}
.home-panel .metric h2{order:1;margin:0;min-height:0;font-size:clamp(11px,3vw,15px);color:#e3e3e3;font-weight:500}
.home-panel .dial{position:relative;width:min(100%,168px);padding:0;box-shadow:none;background:none;isolation:isolate;--track:#555;--arc-start:222deg;--arc-width:clamp(6px,1.7vw,11px)}
.home-panel .metric:last-child .dial{width:min(76vw,218px);--arc-width:clamp(9px,2vw,15px)}
.home-panel .dial::before,.home-panel .dial::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none}
.home-panel .dial::before{border:2px solid var(--track);box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 6px var(--track)}
.home-panel .dial::after{background:conic-gradient(from var(--arc-start),var(--tone) var(--fill),transparent 0);mask:radial-gradient(farthest-side,transparent calc(100% - var(--arc-width)),#000 calc(100% - var(--arc-width) + 1px))}
.home-panel .dial-center{position:relative;background:transparent}
.home-panel .dial strong{color:var(--ink);font-weight:500;font-size:clamp(17px,5vw,31px)}
.home-panel .metric:last-child strong{font-size:clamp(22px,6vw,38px)}
.home-panel .metric .sub{display:none}.home-panel .metric .missing{display:block;order:2;margin:0}
.bottom{background:transparent;border:0;backdrop-filter:none;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.bottom .wrap{max-width:620px;background:#2d2d2d;border:1px solid var(--edge);border-radius:18px;padding:5px;box-shadow:0 4px 22px #1118}
.nav{color:#c3c3c3}
.nav[aria-current=page]{background:#41333a;color:#ffd6e6}
@media(max-width:620px){.top .wrap{height:auto}main{padding-top:14px}.home-panel .gauges{column-gap:9px}.home-panel .dial{width:min(100%,134px)}.home-panel .metric:last-child .dial{width:min(52vw,192px)}}

.detail-panel{margin:16px 0}
.detail-panel .gauges{padding:12px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.detail-panel .metric:last-child{grid-column:auto;width:100%;margin:0}
.detail-panel .dial,.detail-panel .metric:last-child .dial{width:min(100%,125px);--arc-width:7px}
.detail-panel .dial strong,.detail-panel .metric:last-child strong{font-size:clamp(16px,5vw,25px)}
.detail-panel .metric h2{overflow-wrap:anywhere}

.detail-page,.warnings{max-width:620px;margin:0 auto}
.detail-page{display:grid;gap:14px}
.detail-page .heading,.detail-page .detail-panel{margin:0}
.detail-page .back{justify-self:start}
.warnings{margin-top:22px}
.schedule-row{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:10px 0}
.schedule-row input{padding:6px}

.humidifier-picture{position:relative}
.humidifier-picture::before{content:'';position:absolute;width:17px;height:19px;bottom:7px;border:2px solid currentColor;border-radius:7px 7px 5px 5px;background:linear-gradient(0deg,#65c9ff44 35%,transparent 35%)}
.humidifier-picture::after{content:'';position:absolute;width:8px;height:4px;top:7px;border-top:2px solid currentColor;border-radius:50%}

.home-panel .dial::after{filter:blur(2px);opacity:.94}
.home-panel .dial::before{filter:blur(.9px)}
.schedule-modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.schedule-row input[type=number]{width:5rem;background:#191919;color:var(--ink);border:1px solid var(--edge);border-radius:8px}
</style>

<body>
<header class="top"><div class="wrap">
  <div class="room-picker"><select id="room-picker" aria-label="Текущая комната"></select></div>

</div></header>
<main class="wrap">
  <section id="screen" aria-label="Рабочая область"></section>
  <p id="status" class="status" role="status"></p>
</main>
<nav class="bottom" aria-label="Основная навигация"><div class="wrap" id="nav">
  <button class="nav" data-page="home"><span aria-hidden="true">⌂</span>Главная</button>
  <button class="nav" data-page="devices"><span aria-hidden="true">◉</span>Приборы</button>
  <button class="nav" data-page="rooms"><span aria-hidden="true">▦</span>Комнаты</button>
  <button class="nav" data-page="profile"><span aria-hidden="true">♙</span>Профиль</button>
</div></nav>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
<script>
const byId = id => document.getElementById(id);
const node = (tag, className, content) => {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (content !== undefined) element.textContent = content;
  return element;
};
function button(text, className, action) {
  const element = node('button',className,text);
  element.type = 'button';
  element.addEventListener('click',action);
  return element;
}
const power = {id:'power',type:'switch',label:'Питание'};
const brightness = {id:'brightness',type:'slider',label:'Яркость',min:0,max:100,step:1,unit:'%'};
const kinds = {
  humidifier:{label:'Увлажнитель',tone:'#65c9ff',icon:'≋'},
  purifier:{label:'Очиститель',tone:'#75f4b2',icon:'✧'},
  climate:{label:'Датчик климата',tone:'#ffb36f',icon:'◔'},
  light:{label:'Освещение',tone:'#fdd584',icon:'☼'},
  relay:{label:'Реле',tone:'#b6a3ff',icon:'⏻'},
  other:{label:'Другой прибор',tone:'#b6a3ff',icon:'◉'}
};
const metrics = [
  {id:'temperature',label:'Температура',unit:'°C',tone:'var(--amber)',min:0,max:40},
  {id:'humidity',label:'Влажность',unit:'%',tone:'var(--blue)',min:0,max:100},
  {id:'air_quality',label:'Чистота воздуха',unit:'%',tone:'var(--green)',min:0,max:100}
];
const climate = metrics.map(metric => ({id:metric.id,type:'sensor',label:metric.label,unit:metric.unit}));
const seedRooms = [
  {id:'living',name:'Гостиная'},
  {id:'bedroom',name:'Спальня'},
  {id:'kitchen',name:'Кухня'}
];
const seedDevices = [
  {id:'humidifier',name:'Увлажнитель',kind:'humidifier',roomId:'living',online:true,capabilities:[power,{id:'target_humidity',type:'slider',label:'Целевая влажность',min:30,max:70,step:1,unit:'%'}],state:{power:true,target_humidity:50}},
  {id:'purifier',name:'Очиститель воздуха',kind:'purifier',roomId:'living',online:true,capabilities:[power,{id:'speed',type:'slider',label:'Скорость вентилятора',min:1,max:5,step:1}],state:{power:true,speed:2}},
  {id:'climate',name:'Датчик климата',kind:'climate',roomId:'living',online:true,capabilities:climate,state:{temperature:23.4,humidity:46,air_quality:94}},
  {id:'bedroom-climate',name:'Датчик климата',kind:'climate',roomId:'bedroom',online:true,capabilities:climate,state:{temperature:21.8,humidity:52,air_quality:91}},
  {id:'lamp',name:'Ночник',kind:'light',roomId:'bedroom',online:false,capabilities:[power,brightness],state:{power:false,brightness:30}},
  {id:'relay',name:'Реле вытяжки',kind:'relay',roomId:'kitchen',online:true,capabilities:[power],state:{power:false}}
];
const storageKey = 'kontur-dashboard-v2';
function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved?.rooms?.length && Array.isArray(saved.devices) && saved.profile) return saved;
    const previous = JSON.parse(localStorage.getItem('kontur-smart-home-v1'));
    if (Array.isArray(previous)) {
      for (const device of previous) {
        const match = seedDevices.find(item => item.id === device.id);
        if (match) Object.assign(match.state,device.state);
        else if (device.id === 'light') {
          seedDevices.push({...device,roomId:'living',kind:'light'});
        } else {
          let room = seedRooms.find(item => item.name === device.room);
          if (!room) {
            room = {id:'room-' + seedRooms.length,name:device.room};
            seedRooms.push(room);
          }
          seedDevices.push({...device,roomId:room.id,kind:'other'});
        }
      }
    }
  } catch {}
  return {rooms:seedRooms,devices:seedDevices,profile:{name:'Владелец дома',role:'Админ'},roomId:'living'};
}
const data = loadData();
let page = 'home';
let detail;
const water = {id:'water_level',type:'sensor',label:'Уровень воды',unit:'%',min:0,max:100,description:'Показывает остаток воды в баке увлажнителя.'};
const humidifier = data.devices.find(device => device.id === 'humidifier');
if (humidifier && !humidifier.capabilities.some(item => item.id === water.id)) {
  humidifier.capabilities.push(water);
  humidifier.state.water_level = 0;
}
const sensorDescriptions = {
  temperature:'Измеряет температуру воздуха в комнате.',
  humidity:'Измеряет относительную влажность воздуха.',
  air_quality:'Оценивает чистоту воздуха по шкале от 0 до 100%.'
};
function openDetail(type,id,room='') {
  location.hash = new URLSearchParams({page,type,id,room}).toString();
}
function syncRoute() {
  const route = new URLSearchParams(location.hash.slice(1));
  page = Object.hasOwn(pages,route.get('page')) ? route.get('page') : 'home';
  detail = {type:route.get('type'),id:route.get('id'),room:route.get('room')};
  if (dialog.open) dialog.close();
  render();
  window.scrollTo(0,0);
}
let roomId = data.rooms.some(room => room.id === data.roomId) ? data.roomId : data.rooms[0].id;
const dialog = byId('dialog');
const status = message => { byId('status').textContent = message; };
function save(message = '') {
  try {
    localStorage.setItem(storageKey,JSON.stringify({...data,roomId}));
    status(message);
  } catch {
    status((message ? message + ' ' : '') + 'Браузер не сохранил изменения для следующего сеанса.');
  }
}
const currentRoom = () => data.rooms.find(room => room.id === roomId);
const roomDevices = id => data.devices.filter(device => device.roomId === id);
const kindFor = device => kinds[device.kind] ?? kinds.other;
const idFor = () => globalThis.crypto?.randomUUID?.() ?? Date.now() + '-' + Math.random().toString(36).slice(2);
const number = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:8});
const valueText = (value,unit) => Number.isFinite(value) ? number.format(value) + (unit ? ' ' + unit : '') : '—';
function heading(kicker,title,description) {
  const result = node('div','heading');
  result.append(node('p','kicker',kicker),node('h1','',title),node('p','sub',description));
  return result;
}
function sectionHead(title,action) {
  const result = node('div','section-head');
  result.append(node('h2','',title));
  if (action) result.append(action);
  return result;
}
function list(items,emptyText) {
  if (!items.length) return node('p','empty',emptyText);
  const result = node('div','stack');
  result.append(...items);
  return result;
}
function tile(title,detail,icon,tone,action) {
  const result = button('','tile',action);
  result.style.setProperty('--tone',tone);
  const graphic = node('span','square',icon);
  graphic.setAttribute('aria-hidden','true');
  const copy = node('span');
  copy.append(node('span','title',title),node('small','',detail));
  const arrow = node('span','arrow','›');
  arrow.setAttribute('aria-hidden','true');
  result.append(graphic,copy,arrow);
  return result;
}
function deviceTile(device,back) {
  const kind = kindFor(device);
  const connection = device.transport === 'ble-test' ? 'BLE проверен' : device.online ? 'В сети' : 'Не в сети';
  return tile(device.name,kind.label + ' · ' + connection,kind.icon,kind.tone,() => showDevice(device,back));
}
function gauge(metric,devices) {
  const source = devices.find(device => device.online && device.capabilities.some(item => item.id === metric.id && item.type === 'sensor') && Number.isFinite(device.state[metric.id]));
  const result = makeGauge(metric,source?.state[metric.id]);
  const note = node('p',source ? 'sub source' : 'sub missing',source ? source.name : 'Нет показаний');
  result.card.append(note);
  return result.card;
}
function makeGauge(metric,value) {
  const available = Number.isFinite(value);
  const result = node('article','metric');
  result.style.setProperty('--tone',metric.tone);
  const dial = node('div','dial');
  const center = node('div','dial-center');
  const reading = node('strong');
  center.append(reading,node('small','',metric.unit ?? ''));
  dial.append(center);
  result.append(node('h2','',metric.label),dial);
  function update(next) {
    const hasValue = Number.isFinite(next);
    const ratio = metric.max > metric.min && hasValue ? (next - metric.min) / (metric.max - metric.min) : 0;
    result.style.setProperty('--fill',Math.max(0,Math.min(1,ratio)) * 280 + 'deg');
    reading.textContent = hasValue ? (metric.format?.(next) ?? number.format(next)) : '—';
  }
  update(available ? value : undefined);
  return {card:result,update};
}
function renderHome() {
  const room = currentRoom();
  const devices = roomDevices(room.id);
  const panel = node('section','home-panel');
  panel.setAttribute('aria-label','Климат комнаты «' + room.name + '»');
  const gauges = node('div','gauges');
  const order = ['humidity','air_quality','temperature'];
  gauges.append(...order.map(id => gauge(metrics.find(metric => metric.id === id),devices)));
  panel.append(gauges);
  return [panel,warnings(devices)];
}
function warning(device) {
  return device.online && device.kind === 'humidifier' && device.state.water_level === 0;
}
function notifyWarnings() {
  if (globalThis.Notification?.permission !== 'granted') return;
  for (const device of data.devices.filter(warning)) {
    if (device.waterNotificationSent) continue;
    try {
      new Notification(device.name,{body:'В баке закончилась вода',tag:'kontur-water-' + device.id});
      device.waterNotificationSent = true;

  create.value = '';
  mode.append(create);
  for (const device of data.devices.filter(item => item.roomId !== room.id)) {
    const source = data.rooms.find(item => item.id === device.roomId);
    const option = node('option','',device.name + ' · из комнаты «' + (source?.name ?? 'Без комнаты') + '»');
    option.value = device.id;
    mode.append(option);
  }
  const name = nameField('');
  const kind = node('select');
  for (const [id,item] of Object.entries(kinds)) {
    const option = node('option','',item.label);
    option.value = id;
    kind.append(option);
  }
  kind.value = 'other';
  const manifest = node('textarea');
  manifest.required = true;
  manifest.spellcheck = false;
  manifest.value = JSON.stringify({schemaVersion:1,capabilities:[power,brightness]},null,2);
  field(form,error,'Прибор','device-mode',mode);
  const group = node('div');
  const stop = node('span');
  group.append(stop);
  field(group,stop,'Название','device-name',name);
  field(group,stop,'Тип и цвет акцента','device-kind',kind);
  field(group,stop,'Функции (JSON)','device-manifest',manifest);
  stop.remove();
  form.insertBefore(group,error);
  mode.addEventListener('change',() => {
    group.hidden = Boolean(mode.value);
    name.disabled = group.hidden;
    manifest.disabled = group.hidden;
    error.hidden = true;
  });
  mode.focus();
  form.addEventListener('submit',event => {
    event.preventDefault();
    if (mode.value) {
      const device = data.devices.find(item => item.id === mode.value);
      if (!device) return showError(error,'Выбери прибор из списка.');
      device.roomId = room.id;
      return complete('Прибор перемещён в комнату «' + room.name + '».',back);
    }
    const title = name.value.trim();
    if (!title) return showError(error,'Введи название прибора.');
    let capabilities;
    try { capabilities = parseManifest(manifest.value); }
    catch (failure) { return showError(error,failure.message); }
    const state = Object.fromEntries(capabilities.filter(item => item.type !== 'sensor').map(item => [item.id,item.type === 'switch' ? false : item.min]));
    data.devices.push({id:idFor(),name:title,kind:kind.value,roomId:room.id,online:true,capabilities,state});
    complete('Прибор добавлен в комнату «' + room.name + '».',back);
  });
}
for (const tab of byId('nav').children) tab.addEventListener('click',() => navigate(tab.dataset.page));
byId('room-picker').addEventListener('change',event => {
  const selected = event.target.value;
  if (detail?.type) navigate(page);
  selectRoom(selected);
});
window.addEventListener('hashchange',syncRoute);
syncRoute();
runSchedules();
notifyWarnings();
setInterval(runSchedules,1000);
</script>
</body>
</html>
