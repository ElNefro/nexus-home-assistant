services:
  - type: web
    name: nexus-home-assistant
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./public
  - type: web
    name: nexus-home-assistant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python cloud_server.py
    healthCheckPath: /healthz
    envVars:
      - key: KONTUR_CLOUD_HOST
        value: 0.0.0.0
      - key: KONTUR_PANEL_ORIGIN
        value: https://nexus-home-assistant.onrender.com
      - key: KONTUR_OWNER_SHA256
        sync: false
      - key: KONTUR_DEVICE_SHA256
        sync: false
      - key: KONTUR_DEVICE_ID
        sync: false
      - key: KONTUR_SETUP_SHA256
        sync: false
      - key: DATABASE_URL
        sync: false
